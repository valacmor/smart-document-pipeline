name: Run Unit Tests

on: [push]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    - name: download repos
      uses: actions/checkout@v3

    - name: py 3.10 config
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: getting requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: start auto-tests pytest
      run: |
        python -m pytest

